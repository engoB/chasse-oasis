/* ─── Sauvegarde ────────────────────────────────────────────────── */
const Save = {
  key() { return 'oasis:' + (S.cfg?.seasonId || 'x'); },
  now() {
    if (!S.cfg) return;
    Store.set(this.key(), {
      v: 3, stage: S.q.stage, stages: S.q.stages, solvedAt: S.q.solvedAt, hints: S.q.hints,
      probes: S.q.probes, elapsed: S.q.elapsed + (S.q.t0 ? Date.now() - S.q.t0 : 0),
      done: S.q.done, name: S.q.name, final: S.q.final, wrong: S.q.wrong,
      answers: S.q.answers, finishedMs: S.q.finishedMs,
      seen: S.seen, mylist: S.mylist, muted: S.muted, seenBands: S.q.seenBands
    });
  },
  load() {
    const d = Store.get(this.key());
    if (!d) return false;
    Object.assign(S.q, { stage: d.stage || 1, stages: d.stages || {}, solvedAt: d.solvedAt || [], hints: d.hints || {},
      probes: d.probes || {}, elapsed: d.elapsed || 0, done: !!d.done, name: d.name || 'Chasseur',
      final: d.final || null, wrong: d.wrong || {}, seenBands: d.seenBands || {},
      answers: d.answers || {}, finishedMs: d.finishedMs || 0 });
    S.seen = d.seen || {}; S.mylist = d.mylist || []; S.muted = !!d.muted;
    return true;
  },
  reset() { Store.del(this.key()); location.reload(); }
};

/* ─── Le moteur de chasse ───────────────────────────────────────── */
const BANDS = [
  [0, 'glacial', '#3A4A66'], [15, 'froid', '#2E6E8E'], [30, 'frais', '#2FA3A3'],
  [50, 'tiède', '#8FA82E'], [65, 'chaud', '#D08A22'], [80, 'brûlant', '#E8593A'],
  [95, 'imminent', '#E8B23A'], [100, 'cible', '#2FB88A']
];
const band = v => BANDS.reduce((a, b) => v >= b[0] ? b : a, BANDS[0]);

const Quest = {
  stage() { return S.q.stages[S.q.stage] || null; },
  total() { return S.cfg?.stageCount || 4; },

  init() {
    S.q.stages[1] = S.cfg.stage1;
    Save.load();
    S.q.stages[1] = S.cfg.stage1;   /* la config fait toujours autorité sur l'étape ouverte */
    S.q.season = S.cfg.seasonId;
    for (let i = 1; i <= this.total(); i++) if (S.q.stages[i]) Ph.add(S.q.stages[i].phantoms);
    S.q.t0 = S.q.done ? 0 : Date.now();
    this.paintHud();
    setInterval(() => this.tick(), 1000);
  },

  elapsedMs() { return S.q.done ? (S.q.finishedMs || S.q.elapsed) : S.q.elapsed + (S.q.t0 ? Date.now() - S.q.t0 : 0); },
  clock(ms) { const s = Math.floor(ms / 1000); return `${pad2(Math.floor(s / 3600))}:${pad2(Math.floor(s % 3600 / 60))}:${pad2(s % 60)}`; },
  score() {
    const c = S.cfg.scoring || {};
    const probes = Object.values(S.q.probes).reduce((a, b) => a + b.length, 0);
    const hints = Object.values(S.q.hints).reduce((a, b) => a + b.length, 0);
    const wrong = Object.values(S.q.wrong).reduce((a, b) => a + b, 0);
    const mins = Math.floor(this.elapsedMs() / 60000);
    return Math.max(0, Math.round((c.base ?? 10000) - probes * (c.probe ?? 15) - hints * (c.hint ?? 400)
      - wrong * (c.wrongKey ?? 120) - mins * (c.perMinute ?? 6)));
  },
  tick() {
    $('hudClock').textContent = this.clock(this.elapsedMs());
    $('hudScore').textContent = this.score().toLocaleString('fr-FR') + ' pts';
    if (Date.now() % 15000 < 1000) Save.now();
  },
  paintHud() {
    $('hudArc').textContent = S.cfg.seasonTitle || 'ARC —';
    const wrap = $('hudKeys'); wrap.innerHTML = '';
    for (let i = 1; i <= this.total(); i++) {
      const st = S.q.stages[i];
      const state = S.q.done && i === this.total() ? 'done' : i < S.q.stage ? 'done' : i === S.q.stage ? 'active' : 'locked';
      const meta = (S.cfg.stageMeta || [])[i - 1] || {};
      const b = el('button', 'key', `<span class="dot"></span><b>${esc(st?.name || meta.name || '???')}</b>`);
      b.dataset.state = state; b.style.setProperty('--c', st?.hue || meta.hue || 'var(--brass)');
      b.onclick = () => UI.openDossier(); wrap.appendChild(b);
    }
    this.tick();
  },

  /* ── Détection de cible ── */
  async onDetail(it, d, hash) {
    const st = this.stage(); const slot = $('puzzleSlot');
    if (!st || S.q.done) { this.paintRead(null); return; }
    const isTarget = st.target && st.target.h === hash;
    if (isTarget) {
      S.q.pending = { title: d.title || d.name || it.title, kind: it.kind, id: it.id };
      if (slot) this.mountPuzzle(slot, st);
    }
    /* lecture passive : bande seulement, gratuite */
    const p = await this.proximity(it.kind, d, hash);
    this.paintRead(p, isTarget);
  },
  onPhantom(p) {
    const st = this.stage(); const slot = $('puzzleSlot');
    if (!st || S.q.done || !slot) return;
    if (st.target && st.target.h === 'PH:' + p.pid) {
      S.q.pending = { title: p.title, kind: 'phantom', id: p.pid };
      this.mountPuzzle(slot, st);
    }
  },
  paintRead(p, isTarget) {
    const box = $('signalRead'); if (!box) return;
    if (isTarget) { box.innerHTML = `<h4>Lecture de signal</h4><p style="color:var(--brass)">Verrou détecté sur cette fiche. L’énigme est ouverte ci-contre.</p>`; return; }
    if (!p) { box.innerHTML = `<h4>Lecture de signal</h4><p style="color:var(--ash-dim)">Chasse terminée ou en pause.</p>`; return; }
    const bd = band(p.total);
    box.innerHTML = `<h4>Lecture de signal</h4>
      <p style="font-family:var(--f-mono);font-size:1.05rem;color:${bd[2]};letter-spacing:.14em;text-transform:uppercase">${bd[1]}</p>
      <p style="color:var(--ash-dim);font-size:.76rem">Relevé passif, sans coût. Pour le détail chiffré, passez par l’analyseur.</p>`;
  },

  /* ── Empreinte & proximité ── */
  async fingerprint(kind, d) {
    const gg = (d.genres || []).map(x => 'g' + x.id);
    const kw = ((d.keywords?.keywords) || (d.keywords?.results) || []).map(x => 'k' + String(x.name).toLowerCase());
    const cast = ((d.credits?.cast) || (d.aggregate_credits?.cast) || []).slice(0, 12).map(x => 'p' + x.id);
    const crew = ((d.credits?.crew) || []).filter(c => ['Director', 'Writer', 'Screenplay', 'Novel', 'Original Music Composer', 'Director of Photography', 'Producer'].includes(c.job)).slice(0, 10).map(x => 'p' + x.id);
    const co = (d.production_companies || []).slice(0, 6).map(x => 'c' + x.id);
    const H = async arr => Promise.all(arr.map(t => Cx.fp(t)));
    return { g: await H(gg), k: await H(kw), p: await H([...new Set([...cast, ...crew])]), c: await H(co),
      y: parseInt((d.release_date || d.first_air_date || '0').slice(0, 4)) || null, lang: d.original_language || null };
  },
  async proximity(kind, d, selfHash) {
    const st = this.stage(); if (!st || !st.target) return null;
    const h = selfHash || await Cx.tid(kind, d.id);
    if (h === st.target.h) return { total: 100, direct: true, axes: [] };
    const fp = await this.fingerprint(kind, d);
    const t = st.fp || {};
    const ov = (a, b) => (a || []).filter(x => (b || []).includes(x)).length;
    const axes = [];
    const push = (label, val, w, note) => { axes.push({ label, val: clamp(val, 0, 1), w, note }); };
    push('genre', Math.min(ov(fp.g, t.g), 2) / 2, 18);
    push('thème', Math.min(ov(fp.k, t.k), 4) / 4, 26);
    push('équipe', Math.min(ov(fp.p, t.p), 3) / 3, 18);
    push('époque', t.y ? 1 - Math.min(Math.abs((fp.y || 0) - t.y), 35) / 35 : 0, 12);
    push('studio', ov(fp.c, t.c) > 0 ? 1 : 0, 8);
    push('origine', t.lang && fp.lang === t.lang ? 1 : 0, 6);
    /* voisinage : la cible apparaît-elle dans les recommandations de ce titre ? */
    const near = [...(d.recommendations?.results || []), ...(d.similar?.results || [])].slice(0, 40);
    const hashes = await Promise.all(near.map(x => Cx.tid(x.media_type || kind, x.id)));
    const neighbor = hashes.includes(st.target.h);
    push('voisinage', neighbor ? 1 : 0, 12, neighbor ? 'lien direct' : '');
    const total = Math.round(axes.reduce((a, x) => a + x.val * x.w, 0));
    return { total: clamp(total, 0, 99), axes, neighbor, direct: false };
  },

  /* ── Énigme ── */
  mountPuzzle(slot, st) {
    const done = S.q.stage > st.n;
    slot.innerHTML = `<div class="puzzle" style="--c:${st.hue || 'var(--brass)'}">
      <div class="puzzle-h"><span>◆</span> Verrou ${st.n} / ${this.total()} — ${esc(st.name)}</div>
      <div class="puzzle-q">${st.riddle || ''}</div>
      <div class="puzzle-f">${(!S.cfg.hideFormat && st.format) ? `Format attendu : <code>${esc(st.format)}</code> — a` : 'Une seule ligne. A'}ccents, casse, espaces et ponctuation sont ignorés.</div>
      <div class="puzzle-in">
        <input id="pIn" placeholder="Saisissez la combinaison" autocomplete="off" spellcheck="false" ${done ? 'disabled' : ''}>
        <button class="btn btn-q" id="pGo" ${done ? 'disabled' : ''}>Ouvrir le verrou</button>
      </div>
      <div class="puzzle-msg" id="pMsg"></div>
      <div class="hint-list" id="pHints"></div></div>`;
    this.paintHints(st);
    const go = () => this.submit($('pIn').value, st);
    $('pGo').onclick = go;
    $('pIn').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  },
  paintHints(st) {
    const box = $('pHints'); if (!box) return;
    const taken = S.q.hints[st.n] || [];
    box.innerHTML = (st.hints || []).map((h, i) => {
      const open = taken.includes(i);
      return `<div class="hint ${open ? 'open' : ''}"><b>INDICE ${i + 1}</b>
        <span>${open ? h.t : '— — — — — — — — — —'}</span>
        ${open ? '' : `<button onclick="Quest.takeHint(${st.n},${i})">révéler · −${S.cfg.scoring?.hint ?? 400} pts</button>`}</div>`;
    }).join('');
  },
  takeHint(n, i) {
    S.q.hints[n] = S.q.hints[n] || []; if (S.q.hints[n].includes(i)) return;
    S.q.hints[n].push(i); Save.now(); SFX.tap();
    const st = S.q.stages[n]; this.paintHints(st); this.tick();
    Toast.push('Indice révélé', `Étape ${n} · −${S.cfg.scoring?.hint ?? 400} points`, 'q');
  },

  async submit(raw, st) {
    const msg = $('pMsg') || { className: '', textContent: '' }; const now = Date.now();
    if (S.q.cooldown > now) { msg.className = 'puzzle-msg bad'; msg.textContent = `Verrou en sécurité. Réessayez dans ${Math.ceil((S.q.cooldown - now) / 1000)} s.`; return; }
    const v = Cx.norm(raw);
    if (!v) { msg.className = 'puzzle-msg bad'; msg.textContent = 'Saisissez une réponse.'; return; }
    msg.className = 'puzzle-msg'; msg.textContent = 'Dérivation de la clé…';
    let d;
    try { d = await Cx.derive(v, st.seal.salt, S.cfg.kdf?.iter); }
    catch (e) { msg.className = 'puzzle-msg bad'; msg.textContent = 'Moteur cryptographique indisponible (HTTPS requis).'; return; }
    if (d.verify !== st.seal.verify) {
      S.q.wrong[st.n] = (S.q.wrong[st.n] || 0) + 1;
      const n = S.q.wrong[st.n];
      if (n % 5 === 0) { S.q.cooldown = now + Math.min(120, 10 * Math.pow(2, Math.floor(n / 5) - 1)) * 1000; }
      Save.now(); SFX.bad(); this.tick();
      msg.className = 'puzzle-msg bad';
      msg.textContent = `Combinaison rejetée (${n} tentative${n > 1 ? 's' : ''}). ` + (S.q.cooldown > now ? 'Temporisation de sécurité activée.' : 'Vérifiez l’ordre et le format des éléments.');
      return;
    }
    /* clé correcte : on ouvre le maillon suivant */
    msg.className = 'puzzle-msg good'; msg.textContent = 'Clé valide. Ouverture du maillon…';
    S.q.answers[st.n] = { a: v, ...(S.q.pending || {}) };
    await this.unlockFrom(st, d.key);
  },

  async unlockFrom(st, key) {
    let next = null;
    const blob = (S.cfg.chain || [])[st.n - 1];
    if (blob) { try { next = await Cx.open(blob, key); } catch (e) { console.warn(e); } }
    if (st.finalSeal) { try { S.q.final = await Cx.open(st.finalSeal, key); } catch (e) {} }
    S.q.solvedAt.push({ n: st.n, at: this.elapsedMs() });
    if (next) {
      S.q.stages[next.n] = next; Ph.add(next.phantoms);
      S.q.stage = next.n;
      Save.now(); this.paintHud();
      UI.rite(next.glyph || '🗝️', `${st.name} — verrou ouvert`, `Étape ${next.n} déverrouillée : ${next.name}`, st.hue);
      setTimeout(() => { UI.closeRite(); UI.closeDetail(); UI.openDossier(); }, 2600);
    } else {
      S.q.done = true; S.q.stage = this.total(); S.q.finishedMs = this.elapsedMs();
      S.q.t0 = 0; S.q.elapsed = S.q.finishedMs;   /* le chrono s'arrête à la victoire */
      Save.now(); this.paintHud(); Board.submitRun();
      UI.closeDetail(); setTimeout(() => UI.openWin(), 260);
    }
  }
};

/* ─── Analyseur de signal (le jeu du "plus chaud / plus froid") ──── */
const Analyzer = {
  busy: false,
  async probe(query) {
    if (this.busy) return; const st = Quest.stage();
    if (!st || S.q.done) return Toast.push('Analyseur au repos', 'Aucune cible active à traquer.');
    const q = String(query || '').trim(); if (q.length < 2) return;
    this.busy = true; this.paint({ pending: true, name: q });
    try {
      const ghost = Ph.search(q)[0];
      let item = null, detail = null;
      if (ghost) { item = Ph.toItem(ghost); }
      else {
        const r = await TMDB.get('search/multi', { query: q, include_adult: false });
        const best = (r?.results || []).filter(x => x.media_type !== 'person' && x.poster_path)
          .sort((a, b) => (b.popularity || 0) - (a.popularity || 0))[0];
        if (!best) { this.paint({ error: `Aucun titre nommé « ${q} » au catalogue.` }); return; }
        item = toItem(best); detail = await TMDB.detail(item.kind, item.id);
      }
      let p;
      if (ghost) p = { total: st.target?.h === 'PH:' + ghost.pid ? 100 : 20, axes: [], direct: st.target?.h === 'PH:' + ghost.pid };
      else p = await Quest.proximity(item.kind, detail);
      if (!p) { this.paint({ error: 'Aucune cible active à comparer.' }); return; }
      const rec = { name: item.title, kind: item.kind, id: item.id, year: item.year, score: p.total, at: Date.now() };
      const list = S.q.probes[st.n] = S.q.probes[st.n] || [];
      if (!list.some(x => x.kind === rec.kind && x.id === rec.id)) list.push(rec);
      Save.now(); Quest.tick();
      SFX.ping(p.total);
      this.paint({ item, p });
      if (p.total >= 100) {
        Toast.push('Cible confirmée', `${esc(item.title)} porte le verrou. Ouvrez sa fiche.`, 'ok', 7000);
        UI.rite(st.glyph || '◎', 'Cible localisée', item.title, st.hue);
      }
    } finally { this.busy = false; }
  },

  paint(state) {
    const box = $('anaOut'); if (!box) return;
    if (state.pending) { box.innerHTML = `<div class="empty">Sondage de « ${esc(state.name)} »…</div>`; return; }
    if (state.error) { box.innerHTML = `<div class="empty"><b>Rien à sonder</b>${esc(state.error)}</div>`; return; }
    const { item, p } = state; const bd = band(p.total);
    box.innerHTML = `
      <div class="gauge" style="--g:${bd[2]}">
        <div class="gauge-top">
          <div><div class="gauge-val">${p.total}<small>/100</small></div>
            <div class="eyebrow" style="margin-top:8px">${esc(item.title)} · ${esc(item.year)}</div></div>
          <div class="gauge-label">${bd[1]}</div>
        </div>
        <div class="gauge-track"><i style="left:${p.total}%"></i><span class="gauge-needle" style="left:${p.total}%"></span></div>
        <div class="gauge-scale"><span>glacial</span><span>tiède</span><span>brûlant</span><span>cible</span></div>
        ${p.axes?.length ? `<div class="axes">${p.axes.map(a => `<div class="axis"><span>${a.label}</span>
          <div class="bar"><i style="width:${Math.round(a.val * 100)}%;background:${a.val > .66 ? 'var(--brass)' : a.val > .33 ? 'var(--cryo)' : 'var(--ash-dim)'}"></i></div>
          <em>${a.val >= .99 ? '●●●' : a.val > .5 ? '●●○' : a.val > 0 ? '●○○' : '○○○'}</em></div>`).join('')}</div>` : ''}
        ${p.neighbor ? `<p style="font-family:var(--f-mono);font-size:.7rem;color:var(--brass);margin-top:14px">◆ La cible figure dans les recommandations de ce titre.</p>` : ''}
      </div>`;
    this.paintHistory();
  },
  paintHistory() {
    const h = $('anaHist'); if (!h) return; const st = Quest.stage(); if (!st) return;
    const list = [...(S.q.probes[st.n] || [])].sort((a, b) => b.score - a.score);
    h.innerHTML = list.length ? `<div class="eyebrow" style="margin:18px 0 8px">Relevés — étape ${st.n} · ${list.length} sondage(s)</div>
      <div class="probe-list">${list.map((r, i) => {
        const bd = band(r.score);
        return `<button class="probe ${r.score >= 80 ? 'hot' : ''}" data-k="${r.kind}" data-i="${r.id}">
          <span class="rk">${pad2(i + 1)}</span><span class="nm">${esc(r.name)}</span>
          <span class="sc" style="color:${bd[2]}">${r.score}</span></button>`;
      }).join('')}</div>` : '';
    h.querySelectorAll('.probe').forEach(b => b.onclick = () => UI.openDetail({ kind: b.dataset.k, id: +b.dataset.i, title: b.querySelector('.nm').textContent, year: '' }, true));
  }
};

/* ─── Classement ────────────────────────────────────────────────── */
const Board = {
  runs() { return Store.get('oasis:runs:' + S.cfg.seasonId, []); },
  submitRun() {
    const r = { name: S.q.name, ms: Quest.elapsedMs(), score: Quest.score(), at: Date.now(), keys: S.q.solvedAt.length, done: S.q.done };
    const all = this.runs().filter(x => x.name !== r.name); all.push(r);
    Store.set('oasis:runs:' + S.cfg.seasonId, all);
    const ep = S.cfg.leaderboard?.endpoint;
    if (ep) fetch(ep, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ season: S.cfg.seasonId, ...r }) }).catch(() => {});
  },
  rows() {
    const seed = (S.cfg.leaderboard?.seed || []).filter(x => x.name !== S.q.name).map(x => ({ ...x, seed: true }));
    const others = this.runs().filter(x => x.name !== S.q.name);
    const me = { name: S.q.name, ms: Quest.elapsedMs(), score: Quest.score(), keys: S.q.solvedAt.length, done: S.q.done, me: true };
    return [...seed, ...others, me].sort((a, b) => b.score - a.score || a.ms - b.ms);
  },
  render() {
    const rows = this.rows();
    return `<p style="color:var(--ash);font-size:.84rem;line-height:1.6;margin-bottom:14px">
        Le score démarre à ${(S.cfg.scoring?.base ?? 10000).toLocaleString('fr-FR')} points et diminue avec le temps, les sondages et les indices.
        ${Store.persistent ? 'Votre progression est enregistrée sur cet appareil.' : 'Progression en mémoire seulement : ce navigateur bloque le stockage local.'}</p>
      <div class="probe-in"><input id="lbName" value="${esc(S.q.name)}" placeholder="Votre nom de chasseur" maxlength="20">
        <button class="btn btn-s" onclick="Board.rename()">Renommer</button></div>
      <table class="lb"><thead><tr><th>#</th><th>Chasseur</th><th>Temps</th><th>Score</th><th>Progression</th></tr></thead><tbody>
      ${rows.map((r, i) => `<tr class="${r.me ? 'me' : ''}"><td>${i + 1}</td>
        <td>${esc(r.name)}${r.me ? ' <span class="eyebrow">vous</span>' : ''}</td>
        <td class="num">${Quest.clock(r.ms)}</td><td class="num">${Math.round(r.score).toLocaleString('fr-FR')}</td>
        <td>${r.done ? '🥚 Œuf trouvé' : `🗝️ ${r.keys} / ${Quest.total() - 1}`}</td></tr>`).join('')}
      </tbody></table>
      <p style="margin-top:16px"><button class="btn btn-s" onclick="if(confirm('Effacer la progression de cette saison ?'))Save.reset()">Réinitialiser ma partie</button></p>`;
  },
  rename() { const v = $('lbName').value.trim().slice(0, 20); if (v) { S.q.name = v; Save.now(); UI.paintDrawer(); Toast.push('Nom enregistré', esc(v), 'ok'); } }
};

/* ─── Tiroir : dossier / analyseur / classement / forge ─────────── */
Object.assign(UI, {
  openDrawer(tab) {
    const wasOpen = $('sheetDrawer').classList.contains('open');
    S.activeDrawerTab = tab || S.activeDrawerTab;
    $('sheetDrawer').classList.add('open'); document.body.classList.add('locked');
    [...$('drawerTabs').children].forEach(b => b.setAttribute('aria-selected', String(b.dataset.t === S.activeDrawerTab)));
    this.paintDrawer();
    wasOpen ? Nav.replace() : Nav.push();
  },
  closeDrawer() { Nav.rewind(); },
  openDossier() { this.openDrawer('dossier'); },
  openLb() { this.openDrawer('lb'); },
  openAnalyzer(prefill) {
    this.openDrawer('analyzer');
    if (prefill) { const i = $('anaIn'); if (i) { i.value = prefill; } }
  },
  paintDrawer() {
    const b = $('drawerBody'), t = S.activeDrawerTab;
    $('drawerTitle').textContent = { dossier: 'Dossier d’enquête', analyzer: 'Analyseur de signal', lb: 'Classement', forge: 'Forge de saison' }[t] || 'Dossier';
    if (t === 'dossier') b.innerHTML = this.dossierHTML();
    else if (t === 'lb') b.innerHTML = Board.render();
    else if (t === 'forge') { b.innerHTML = Forge.html(); Forge.wire(); }
    else {
      b.innerHTML = `<p style="color:var(--ash);font-size:.84rem;line-height:1.65;margin-bottom:14px">
          Entrez un titre : l’analyseur compare son ADN (genres, thèmes, équipe, époque, voisinage) à celui de la cible recherchée,
          sans jamais la nommer. Chaque sondage coûte ${S.cfg.scoring?.probe ?? 15} points.</p>
        <div class="probe-in"><input id="anaIn" placeholder="Ex. : Blade Runner" autocomplete="off">
          <button class="btn btn-q" id="anaGo">Sonder</button></div>
        <div id="anaOut"><div class="empty"><b>Aucun relevé</b>Sondez un titre pour situer votre distance à la cible.</div></div>
        <div id="anaHist"></div>`;
      const go = () => { const v = $('anaIn').value; $('anaIn').select(); Analyzer.probe(v); };
      $('anaGo').onclick = go;
      $('anaIn').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
      Analyzer.paintHistory();
    }
  },
  dossierHTML() {
    if (!S.cfg.stage1) return `<div class="empty"><b>Aucune saison chargée</b>Le fichier <code>quest-config.js</code> n’a pas été trouvé à côté de <code>index.html</code>. Le catalogue reste consultable.</div>`;
    const total = Quest.total(), doneN = S.q.done ? total : S.q.stage - 1;
    let out = `<div class="gauge" style="--g:var(--brass)">
      <div class="gauge-top"><div><div class="gauge-val">${Math.round(doneN / total * 100)}<small>%</small></div>
        <div class="eyebrow" style="margin-top:8px">${esc(S.cfg.seasonTitle)}</div></div>
        <div class="gauge-label">${doneN} / ${total} verrous</div></div>
      <div class="gauge-track" style="background:linear-gradient(90deg,var(--oxide),var(--brass))">
        <i style="left:${doneN / total * 100}%"></i></div>
      <div class="gauge-scale"><span>départ</span><span>œuf d’or</span></div></div>`;
    if (S.q.done) out += `<div class="side-block" style="border-color:rgba(232,178,58,.4);margin-bottom:18px">
        <h4>Chasse terminée</h4>
        <p>Arc bouclé en <strong>${Quest.clock(Quest.elapsedMs())}</strong> pour <strong>${Quest.score().toLocaleString('fr-FR')}</strong> points.</p>
        ${S.cfg.nextSeasonAt ? `<p style="margin-top:8px"><span style="color:var(--ash-dim)">Prochaine chasse dans</span><br><span class="countdown" id="dossierCd">${countdownTo(S.cfg.nextSeasonAt)}</span></p>` : ''}
        <p style="margin-top:10px"><button class="btn btn-q" onclick="UI.openWin()">Revoir mon certificat</button></p></div>`;
    else if (S.cfg.tagline) out += `<p style="color:var(--ash);font-size:.85rem;line-height:1.7;margin-bottom:18px">${S.cfg.tagline}</p>`;
    for (let i = 1; i <= total; i++) {
      const st = S.q.stages[i], meta = (S.cfg.stageMeta || [])[i - 1] || {};
      const state = S.q.done && i === total ? 'done' : i < S.q.stage ? 'done' : i === S.q.stage ? 'active' : 'locked';
      const hue = st?.hue || meta.hue || 'var(--brass)';
      out += `<article class="node" data-s="${state}" style="--c:${hue}">
        <div class="node-h"><span>${st?.glyph || meta.glyph || '🔒'}</span><b>${esc(st?.name || meta.name || 'Verrou scellé')}</b>
          <span class="st">${state === 'done' ? 'ouvert' : state === 'active' ? 'en cours' : 'scellé'}</span></div>
        <div class="node-b">${st ? (state === 'done' ? `<span style="color:var(--jade)">Verrou ouvert en ${Quest.clock((S.q.solvedAt.find(x => x.n === i) || {}).at || 0)}.</span> ${st.brief}` : st.brief)
          : `Contenu chiffré. Cette étape n’existe en clair nulle part tant que le verrou précédent n’est pas ouvert — pas même dans le fichier de configuration.`}</div>
        ${state === 'done' && S.q.answers[i] ? `<div class="solved">
            <span class="eyebrow">Cible</span>
            ${S.q.answers[i].id ? `<button class="linkish" onclick="UI.openDetail({kind:'${S.q.answers[i].kind}',id:${typeof S.q.answers[i].id === 'number' ? S.q.answers[i].id : `'${esc(S.q.answers[i].id)}'`}},true)">${esc(S.q.answers[i].title || '—')}</button>` : `<b>${esc(S.q.answers[i].title || '—')}</b>`}
            <span class="eyebrow" style="margin-top:10px">Réponse</span><code>${esc(S.q.answers[i].a)}</code></div>` : ''}
        ${st && state === 'active' && st.hints?.length ? `<div style="margin-top:10px" class="eyebrow">${(S.q.hints[i] || []).length} / ${st.hints.length} indice(s) utilisé(s) — révélables depuis la fiche cible</div>` : ''}
      </article>`;
    }
    if (S.q.done && S.q.final) out += `<article class="node" data-s="done" style="--c:var(--brass);margin-top:18px">
      <div class="node-h"><span>🥚</span><b>${esc(S.q.final.title || 'Certificat')}</b><span class="st">acquis</span></div>
      <div class="node-b">${S.q.final.text || ''}${S.q.final.code ? `<br><br><code>${esc(S.q.final.code)}</code>` : ''}</div></article>`;
    out += `<p style="margin-top:18px"><button class="btn btn-s" onclick="UI.openAnalyzer()">◈ Ouvrir l’analyseur</button></p>`;
    return out;
  }
});

      </div>
      <div class="forge-out" id="forgeOut">En attente de compilation…</div>

      <hr style="border:none;border-top:1px solid var(--line);margin:28px 0">
      <p style="color:var(--ash);font-size:.84rem;line-height:1.65"><strong>Forge quotidienne.</strong> Une ligne par titre,

      données réelles, scelle chaque journée et complète la banque existante (${(window.DAILY_DB?.days || []).length} jour(s) déjà en place).</p>
      <label for="forgeDaily">Titres à ajouter</label>
      <textarea id="forgeDaily" spellcheck="false" placeholder="Blade Runner 2049 (2017)&#10;Severance (2022)&#10;Le Grand Bleu (1988)"></textarea>
      <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
        <button class="btn btn-q" id="forgeDailyGo">Compiler la banque quotidienne</button>
        <button class="btn btn-s" id="forgeDailyDl">Télécharger daily-db.js</button>
      </div>
      <div class="forge-out" id="forgeDailyOut">En attente de compilation…</div></div>`;
  },
  wire() {
    $('forgeGo').onclick = () => this.compile();
    $('forgeCopy').onclick = () => { navigator.clipboard.writeText(this.last || '').then(() => Toast.push('Copié', 'quest-config.js dans le presse-papier', 'ok')); };
    $('forgeDailyGo').onclick = () => this.compileDaily();
    $('forgeDailyDl').onclick = () => {
      const b = new Blob([this.lastDaily || ''], { type: 'text/javascript' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'daily-db.js'; a.click();
    };
    $('forgeDl').onclick = () => {
      const b = new Blob([this.last || ''], { type: 'text/javascript' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'quest-config.js'; a.click();
    };
  },
  rand(n) { return Cx.hex(crypto.getRandomValues(new Uint8Array(n))); },
  async dayKey(salt, i) {
    return crypto.subtle.importKey('raw', await crypto.subtle.digest('SHA-256', Cx.te.encode(`${salt}|day|${i}`)),
      'AES-GCM', false, ['encrypt', 'decrypt']);
  },
  async compileDaily() {
    const out = $('forgeDailyOut'); out.textContent = 'Compilation…';
    const lines = $('forgeDaily').value.split('\n').map(x => x.trim()).filter(Boolean);
    if (!lines.length) { out.textContent = 'Aucun titre fourni.'; return; }
    const db = window.DAILY_DB || { salt: this.rand(16), epoch: new Date().toISOString().slice(0, 10), days: [] };
    const days = [...db.days]; const log = [];
    for (const line of lines) {
      const m = line.match(/^(.*?)\s*\((\d{4})\)\s*$/);
      const title = (m ? m[1] : line).trim(), year = m ? +m[2] : null;
      const r = await TMDB.get('search/multi', { query: title, include_adult: false });
      const hit = (r?.results || []).filter(x => x.media_type !== 'person')
        .sort((a, b) => (b.popularity || 0) - (a.popularity || 0))
        .find(x => !year || String(x.release_date || x.first_air_date || '').startsWith(String(year))) || (r?.results || [])[0];
      if (!hit) { log.push(`✘ ${line} — introuvable`); continue; }
      const kind = hit.media_type === 'tv' ? 'tv' : 'movie';
      const d = await TMDB.detail(kind, hit.id);
      if (!d) { log.push(`✘ ${line} — fiche illisible`); continue; }
      const y = parseInt(String(d.release_date || d.first_air_date || '').slice(0, 4)) || year || 0;
      const genres = (d.genres || []).map(g => g.name);
      const kw = ((d.keywords?.keywords) || (d.keywords?.results) || []).map(k => k.name).slice(0, 6);
      const dirs = kind === 'tv' ? (d.created_by || []).map(c => c.name)
        : (d.credits?.crew || []).filter(c => c.job === 'Director').map(c => c.name);
      const cast = ((d.credits?.cast) || (d.aggregate_credits?.cast) || []).slice(0, 2).map(c => c.name);
      const studio = (d.production_companies || [])[0]?.name || (d.networks || [])[0]?.name || '—';
      const nat = (d.origin_country || [])[0] || (d.production_countries || [])[0]?.iso_3166_1 || '';
      const hints = [
        `${kind === 'tv' ? 'Série' : 'Film'}${nat ? ' (' + nat + ')' : ''} de ${y}, ${(genres[0] || 'genre inconnu').toLowerCase()}.`,
        kw.length ? `Thèmes récurrents : ${kw.slice(0, 3).join(', ')}.` : `Classé ${genres.join(', ') || '—'}.`,
        `${kind === 'tv' ? 'Créée par' : 'Réalisé par'} ${dirs.join(', ') || 'un auteur non crédité'} — production ${studio}.`,
        cast.length ? `À l’affiche : ${cast.join(' et ')}.` : `Distribution non renseignée.`,
        kind === 'tv' ? `${d.number_of_seasons || '?'} saison(s), ${d.number_of_episodes || '?'} épisodes, note ${(d.vote_average || 0).toFixed(1)}/10.`
                      : `${d.runtime || '?'} minutes, note ${(d.vote_average || 0).toFixed(1)}/10${kw[3] ? ', autour de « ' + kw[3] + ' »' : ''}.`
      ];
      const payload = { i: days.length, kind, titles: [...new Set([d.title || d.name, d.original_title || d.original_name].filter(Boolean))],
        year: y, genres, people: [...dirs, ...cast].slice(0, 4), studio,
        len: kind === 'tv' ? (d.number_of_seasons || 1) : (d.runtime || 0), hints };
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await this.dayKey(db.salt, days.length), Cx.te.encode(JSON.stringify(payload)));
      const buf = new Uint8Array(12 + ct.byteLength); buf.set(iv); buf.set(new Uint8Array(ct), 12);
      days.push(Cx.b64e(buf));
      log.push(`✔ jour ${days.length} — ${payload.titles[0]} (${y})`);
    }
    this.lastDaily = `/* daily-db.js — ${days.length} jours · généré le ${new Date().toISOString().slice(0, 10)} */\n`
      + `window.DAILY_DB = ${JSON.stringify({ schema: 1, salt: db.salt, epoch: db.epoch, count: days.length, days }, null, 2)};\n`;
    out.textContent = log.join('\n') + `\n\n→ ${days.length} jours au total. Téléchargez le fichier et remplacez daily-db.js.`;
    Toast.push('Banque quotidienne compilée', `${days.length} jour(s)`, 'ok');
  },
  async compile() {
    const out = $('forgeOut'); out.textContent = 'Compilation…';
    let def; try { def = JSON.parse($('forgeSrc').value); } catch (e) { out.textContent = 'JSON invalide : ' + e.message; return; }
    const prevSalt = S.cfg.idSalt;
    try {
      const idSalt = def.idSalt || this.rand(16); S.cfg.idSalt = idSalt;
      const iter = def.iter || 200000;
      const stages = [];
      for (let i = 0; i < def.stages.length; i++) {
        const s = def.stages[i];
        let fp = null, h = null;
        if (s.target?.kind === 'phantom') h = 'PH:' + s.target.id;
        else { h = await Cx.tid(s.target.kind, s.target.id); const d = await TMDB.detail(s.target.kind, s.target.id); if (d) fp = await Quest.fingerprint(s.target.kind, d); }
        const phantoms = (s.phantoms || []).map(p => ({ ...p }));
        for (const p of phantoms) if (p.anchors) p.anchors = await Promise.all(p.anchors.map(a => typeof a === 'string' ? a : Cx.tid(a.kind, a.id)));
        stages.push({ n: i + 1, name: s.name, glyph: s.glyph, hue: s.hue, brief: s.brief, riddle: s.riddle, format: s.format,
          hints: (s.hints || []).map(t => ({ t })), target: { h, kind: s.target.kind }, fp, phantoms,
          seal: { salt: this.rand(16), verify: '' }, _answer: s.answer });
      }
      const keys = [];
      for (let i = 0; i < stages.length; i++) {
        const k = await Cx.derive(stages[i]._answer, stages[i].seal.salt, iter);
        stages[i].seal.verify = k.verify; keys.push(k);
      }
      if (def.final) stages[stages.length - 1].finalSeal = await Cx.seal(def.final, keys[keys.length - 1].key);
      const chain = [];
      for (let i = 0; i < stages.length - 1; i++) {
        const clean = { ...stages[i + 1] }; delete clean._answer;
        chain.push(await Cx.seal(clean, keys[i].key));
      }
      const s1 = { ...stages[0] }; delete s1._answer;
      const cfg = {
        schema: 3, seasonId: def.seasonId, seasonTitle: def.seasonTitle, tagline: def.tagline,
        tmdbKey: def.tmdbKey || S.cfg.tmdbKey, lang: def.lang || 'fr-FR', region: def.region || 'FR',
        idSalt, kdf: { iter }, scoring: def.scoring || S.cfg.scoring, stageCount: stages.length,
        stageMeta: stages.map(s => ({ name: '???', glyph: '🔒', hue: s.hue })),
        stage1: s1, chain, leaderboard: def.leaderboard || { seed: [] }
      };
      cfg.stageMeta[0] = { name: s1.name, glyph: s1.glyph, hue: s1.hue };
      this.last = '/* quest-config.js — généré par la Forge OASIS le ' + new Date().toISOString() + ' */\n'
        + 'window.QUEST_CONFIG = ' + JSON.stringify(cfg, null, 2) + ';\n';
      out.textContent = this.last.slice(0, 4000) + (this.last.length > 4000 ? '\n\n… (' + this.last.length + ' caractères — utilisez Copier ou Télécharger)' : '');
      Toast.push('Saison compilée', `${stages.length} étape(s) scellée(s)`, 'ok');
    } catch (e) { out.textContent = 'Échec : ' + e.message; }
    finally { S.cfg.idSalt = prevSalt; }
  }
};


/* ══════════════════════════════════════════════════════════════════
   MODE QUOTIDIEN — une énigme par jour, six essais, indices dégressifs
   ══════════════════════════════════════════════════════════════════ */
const normTitle = s => Cx.norm(s).replace(/^(LE|LA|LES|L|THE|UN|UNE)\s+/, '');

const Daily = {
  db: null, day: null, abs: 0, run: null, sugTimer: null, cd: null,

  ready() { return !!(this.db && this.db.days?.length); },
  midnight(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; },
  absIndex() {
    const ep = this.midnight(this.db.epoch + 'T00:00:00');
    return Math.max(0, Math.round((this.midnight(new Date()) - ep) / 864e5));
  },
  async load() {
    this.db = window.DAILY_DB || null;
    if (!this.ready()) return false;
    this.abs = this.absIndex();
    const i = this.abs % this.db.count;
    const raw = Cx.b64d(this.db.days[i]);
    const key = await crypto.subtle.importKey('raw',
      await crypto.subtle.digest('SHA-256', Cx.te.encode(`${this.db.salt}|day|${i}`)), 'AES-GCM', false, ['decrypt']);
    this.day = JSON.parse(Cx.td.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(0, 12) }, key, raw.slice(12))));
    this.run = Store.get('oasis:daily:' + this.abs, { guesses: [], hints: 1, done: false, won: false });
    return true;
  },
  stats() { return Store.get('oasis:daily:stats', { played: 0, wins: 0, cur: 0, max: 0, last: -1, dist: [0, 0, 0, 0, 0, 0] }); },
  save() { Store.set('oasis:daily:' + this.abs, this.run); },
  left() { return 6 - this.run.guesses.length; },

  cat() { return this.day.cat || (this.day.kind === 'tv' ? 'Série' : 'Film'); },
  free() { return this.day.mode === 'free'; },
  emoji() { return { 'Film': '🎬', 'Série': '📺', 'Jeu vidéo': '🎮', 'Personnage': '🦸' }[this.cat()] || '✴️'; },

  /* Squelette de la réponse : une lettre de plus à chaque erreur */
  mask() {
    const t = this.day.titles[0], isL = c => /[0-9A-Za-zÀ-ÖØ-öø-ÿ]/.test(c);
    const idx = [...t].map((c, i) => isL(c) ? i : -1).filter(i => i >= 0);
    if (!idx.length) return t;
    const order = idx.slice().sort((a, b) => ((a * 7919 + this.abs * 131) % 997) - ((b * 7919 + this.abs * 131) % 997));
    const wrong = this.run.guesses.filter(g => !g.win).length;
    const cap = Math.max(1, Math.floor(idx.length * .4));
    const shown = new Set(this.run.done ? idx : order.slice(0, Math.min(wrong, cap)));
    return [...t].map((c, i) => isL(c) ? (shown.has(i) ? c : '·') : c).join('');
  },

  /* ── Proposition en texte libre (jeux, personnages, divers) ── */
  compareFree(text) {
    const g = normTitle(text), D = this.day;
    const win = D.titles.some(t => normTitle(t) === g);
    const near = !win && (D.near || []).some(t => normTitle(t) === g);
    const words = w => Cx.norm(w).split(' ').filter(x => x.length > 3);
    const shared = !win && !near && D.titles.concat(D.near || []).some(t => words(t).some(x => words(text).includes(x)));
    return { free: true, win, title: text.trim(), year: '', kind: D.kind,
      score: win ? 100 : near ? 68 : shared ? 42 : 6,
      verdict: win ? 'exact' : near ? 'même univers, mauvaise cible' : shared ? 'un mot en commun' : 'hors sujet' };
  },

  /* ── Comparaison d'une proposition avec la cible du jour ── */
  async compare(item) {
    const d = await TMDB.detail(item.kind, item.id) || {};
    const D = this.day;
    const gGenres = (d.genres || []).map(g => Cx.norm(g.name));
    const gPeople = [
      ...((d.credits?.cast || d.aggregate_credits?.cast || []).slice(0, 8)),
      ...((d.credits?.crew || []).filter(c => ['Director', 'Writer', 'Screenplay', 'Creator', 'Original Music Composer'].includes(c.job))),
      ...((d.created_by) || [])
    ].map(p => Cx.norm(p.name));
    const gCos = (d.production_companies || []).map(c => Cx.norm(c.name));
    const gYear = parseInt((d.release_date || d.first_air_date || '0').slice(0, 4)) || item.year | 0;

    const ovG = D.genres.filter(g => gGenres.includes(Cx.norm(g))).length;
    const ovP = D.people.filter(p => gPeople.includes(Cx.norm(p))).length;
    const studio = gCos.some(c => c.includes(Cx.norm(D.studio)) || Cx.norm(D.studio).includes(c));
    const dy = Math.abs(gYear - D.year);
    const kindOk = item.kind === D.kind;

    const titles = [d.title, d.name, d.original_title, d.original_name, item.title].filter(Boolean).map(normTitle);
    const win = D.titles.some(t => titles.includes(normTitle(t)));

    const score = win ? 100 : Math.round(
      (kindOk ? 12 : 0) + 24 * (1 - Math.min(dy, 30) / 30) +
      28 * Math.min(ovG, 2) / 2 + 24 * Math.min(ovP, 2) / 2 + (studio ? 12 : 0));

    return { win, score, kindOk, dy, gYear, ovG, ovP, studio,
      title: d.title || d.name || item.title, year: gYear || '—', poster: item.poster, kind: item.kind };
  },

  async guess(item) {
    if (this.run.done || !this.left()) return;
    const r = (item && item.freeText != null) ? this.compareFree(item.freeText) : await this.compare(item);
    if (!r.title) return;
    this.run.guesses.push(r);
    if (r.win) { this.run.done = true; this.run.won = true; SFX.good(); }
    else if (!this.left()) { this.run.done = true; SFX.bad(); }
    else { this.run.hints = Math.min(5, this.run.hints + 1); SFX.ping(r.score); }
    if (this.run.done) this.record();
    this.save(); this.render();
  },
  takeHint() {
    if (this.run.done || this.run.hints >= 5 || !this.left()) return;
    this.run.hints++;
    this.run.guesses.push({ skipped: true, score: 0, title: 'Indice demandé' });
    if (!this.left()) { this.run.done = true; this.record(); }
    this.save(); this.render(); SFX.tap();
  },
  record() {
    const s = this.stats();
    s.played++;
    if (this.run.won) {
      s.wins++;
      const n = this.run.guesses.filter(g => !g.skipped).length;
      s.dist[Math.min(5, Math.max(0, n - 1))]++;
      s.cur = (s.last === this.abs - 1) ? s.cur + 1 : 1;
      s.max = Math.max(s.max, s.cur);
    } else s.cur = 0;
    s.last = this.abs;
    Store.set('oasis:daily:stats', s);
  },

  grid() {
    return this.run.guesses.map(g => g.skipped ? '⬛' : g.win ? '🟩' : g.score >= 55 ? '🟨' : '🟥').join('')
      + '⬜'.repeat(Math.max(0, 6 - this.run.guesses.length));
  },
  share() {
    const n = this.run.won ? this.run.guesses.length : 'X';
    const txt = `OASIS quotidien #${this.abs + 1} ${this.emoji()} — ${n}/6\n${this.grid()}\n${location.origin + location.pathname}#daily`;
    navigator.share ? navigator.share({ text: txt }).catch(() => {})
      : navigator.clipboard.writeText(txt).then(() => Toast.push('Résultat copié', 'Collez-le où vous voulez.', 'ok')).catch(() => {});
  },
  toMidnight() {
    const n = new Date(); const m = new Date(n); m.setHours(24, 0, 0, 0);
    const t = m - n, h = Math.floor(t / 36e5), mi = Math.floor(t % 36e5 / 6e4), s = Math.floor(t % 6e4 / 1000);
    return `${pad2(h)} h ${pad2(mi)} m ${pad2(s)} s`;
  },

  /* ── Rendu ── */
  render() {
    const host = $('rows');
    const D = this.day, r = this.run;
    const st = this.stats();
    host.innerHTML = `<section class="daily">
      <div class="daily-head">
        <div><div class="eyebrow">${new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' })}</div>
          <h1 class="daily-t">Énigme du jour <span class="mono">#${this.abs + 1}</span></h1>
          <p class="daily-sub"><span class="catbadge">${this.emoji()} ${esc(this.cat())}</span>
            À trouver en six propositions. Chaque erreur libère un indice${this.free() ? ' et une lettre' : ''}.</p></div>
        <div class="streak"><b>${st.cur}</b><span>jour(s) d’affilée</span><em>record ${st.max}</em></div>
      </div>

      <div class="hint-stack">${D.hints.slice(0, r.hints).map((h, i) =>
        `<div class="dhint"><b>INDICE ${i + 1}</b><span>${esc(h)}</span></div>`).join('')}
        ${r.hints < 5 && !r.done ? `<div class="dhint locked"><b>INDICE ${r.hints + 1}</b><span>— — — — — — —</span></div>` : ''}</div>

      ${this.free() ? `<div class="dmask" aria-label="Squelette de la réponse">${esc(this.mask())}</div>` : ''}

      <div class="dboard">${r.guesses.map(g => this.rowHTML(g)).join('')}
        ${!r.done ? `<div class="dslot">${this.left()} proposition(s) restante(s)</div>` : ''}</div>

      ${r.done ? this.resultHTML() : `<div class="dinput">
          <input id="dGuess" placeholder="${this.free() ? 'Tapez votre réponse…' : 'Tapez un titre de film ou de série…'}" autocomplete="off" spellcheck="false">
          ${this.free() ? '<button class="btn btn-p" id="dGoBtn">Proposer</button>' : ''}
          <button class="btn btn-s" id="dHintBtn" ${r.hints >= 5 ? 'disabled' : ''}>Indice (coûte un essai)</button>
        </div><div class="suggest" id="dSuggest"></div>`}
    </section>`;

    if (!r.done) {
      const inp = $('dGuess');
      if (this.free()) {
        const go = () => { const v = inp.value.trim(); if (v) { inp.value = ''; this.guess({ freeText: v }); } };
        $('dGoBtn').onclick = go;
        inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
      } else {
        inp.addEventListener('input', () => { clearTimeout(this.sugTimer); this.sugTimer = setTimeout(() => this.suggest(inp.value), 260); });
        inp.addEventListener('keydown', e => { if (e.key === 'Enter') { const f = $('dSuggest').querySelector('.sug'); if (f) f.click(); } });
      }
      $('dHintBtn').onclick = () => this.takeHint();
      inp.focus();
    } else {
      $('dShare').onclick = () => this.share();
      if (this.free()) return;
      clearInterval(this.cd);
      this.cd = setInterval(() => { const e = $('dCd'); if (!e) return clearInterval(this.cd); e.textContent = this.toMidnight(); }, 1000);
      this.poster();
    }
  },
  rowHTML(g) {
    if (g.skipped) return `<div class="drow skip"><span class="dscore">—</span><span class="dtitle">Indice demandé</span></div>`;
    const bd = band(g.score);
    if (g.free) return `<div class="drow" style="--b:${bd[2]}"><span class="dscore">${g.score}</span>
      <span class="dtitle">${esc(g.title)}<span class="gchips"><span class="gchip ${g.win ? 'ok' : g.score > 50 ? 'warn' : ''}">${esc(g.verdict)}</span></span></span>
      <span class="dband">${bd[1]}</span></div>`;
    return `<div class="drow" style="--b:${bd[2]}">
      <span class="dscore">${g.score}</span>
      <span class="dtitle">${esc(g.title)} <em>${esc(String(g.year))}</em>
        <span class="gchips">
          <span class="gchip ${g.kindOk ? 'ok' : ''}">${g.kind === 'tv' ? 'série' : 'film'}</span>
          <span class="gchip ${g.dy === 0 ? 'ok' : g.dy <= 5 ? 'warn' : ''}">${g.dy === 0 ? 'même année' : g.dy + ' an(s) d’écart'}</span>
          <span class="gchip ${g.ovG ? 'ok' : ''}">${g.ovG} genre(s)</span>
          <span class="gchip ${g.ovP ? 'ok' : ''}">${g.ovP ? g.ovP + ' nom(s) en commun' : 'équipe différente'}</span>
          ${g.studio ? '<span class="gchip ok">même studio</span>' : ''}
        </span></span>
      <span class="dband">${bd[1]}</span></div>`;
  },
  resultHTML() {
    const s = this.stats(), D = this.day, r = this.run;
    const max = Math.max(1, ...s.dist);
    return `<div class="dresult ${r.won ? 'won' : 'lost'}">
      <div class="eyebrow">${r.won ? `Trouvé en ${r.guesses.length} proposition(s)` : 'Raté pour aujourd’hui'}</div>
      <div class="dans"><img id="dPoster" alt="" hidden><div>
        <h2>${esc(D.titles[0])}</h2>
        <p class="mono">${this.emoji()} ${esc(this.cat())} · ${D.year} · ${esc(D.genres.join(', '))}</p>
        <p class="mono" style="color:var(--ash-dim)">${esc(D.people.join(' · '))}${D.studio && D.studio !== '—' ? ' · ' + esc(D.studio) : ''}</p></div></div>
      ${D.trivia ? `<div class="trivia"><b>Le saviez-vous</b><p>${esc(D.trivia)}</p></div>` : ''}
      <div class="dgrid">${this.grid()}</div>
      <div class="dstats">
        <div class="stat"><b>${s.played}</b><span>parties</span></div>
        <div class="stat"><b>${s.played ? Math.round(s.wins / s.played * 100) : 0} %</b><span>réussite</span></div>
        <div class="stat"><b>${s.cur}</b><span>série</span></div>
        <div class="stat"><b>${s.max}</b><span>record</span></div>
      </div>
      <div class="dist">${s.dist.map((v, i) => `<div class="distrow"><span>${i + 1}</span>
        <i style="width:${Math.max(4, v / max * 100)}%">${v || ''}</i></div>`).join('')}</div>
      <div class="win-actions">
        <button class="btn btn-q" id="dShare">Partager mon résultat</button>
        <button class="btn btn-s" onclick="App.setView('home')">Retour au catalogue</button>
      </div>
      <div class="eyebrow" style="margin-top:18px">Prochaine énigme dans</div>
      <div class="countdown" id="dCd">${this.toMidnight()}</div>
    </div>`;
  },
  async poster() {
    const r = await TMDB.get(`search/${this.day.kind}`, { query: this.day.titles[0], year: this.day.year, first_air_date_year: this.day.year });
    const hit = (r?.results || [])[0]; const el2 = $('dPoster');
    if (hit?.poster_path && el2) { el2.src = TMDB.img(hit.poster_path, 'w185'); el2.hidden = false; }
  },
  async suggest(q) {
    const box = $('dSuggest'); if (!box) return;
    if (q.trim().length < 2) { box.innerHTML = ''; return; }
    const r = await TMDB.get('search/multi', { query: q.trim(), include_adult: false });
    const list = (r?.results || []).filter(x => x.media_type !== 'person' && x.poster_path).slice(0, 6).map(x => toItem(x));
    box.innerHTML = list.map((it, i) => `<button class="sug" data-i="${i}">
      <img src="${it.poster}" alt="" loading="lazy"><span>${esc(it.title)}<em>${esc(it.year)} · ${it.kind === 'tv' ? 'série' : 'film'}</em></span></button>`).join('');
    box.querySelectorAll('.sug').forEach(b => b.onclick = async () => {
      box.innerHTML = ''; $('dGuess').value = '';
      await this.guess(list[+b.dataset.i]);
    });
  }
};

/* ─── Compte à rebours & écran de victoire ──────────────────────── */
function countdownTo(iso) {
  const t = new Date(iso).getTime() - Date.now();
  if (isNaN(t)) return '—';
  if (t <= 0) return 'ouverte';
  const d = Math.floor(t / 864e5), h = Math.floor(t % 864e5 / 36e5), m = Math.floor(t % 36e5 / 6e4), sec = Math.floor(t % 6e4 / 1000);
  return `${d} j ${pad2(h)} h ${pad2(m)} m ${pad2(sec)} s`;
}

Object.assign(UI, {
  openWin(silent) {
    $('sheetWin').classList.add('open'); document.body.classList.add('locked');
    if (!silent) Nav.push();
    this.paintWin();
    if (!silent) { SFX.key(); this.celebrate(); }
    clearInterval(this._cd);
    this._cd = setInterval(() => {
      const a = $('winCd'), b = $('dossierCd');
      if (!a && !b) return clearInterval(this._cd);
      const v = countdownTo(S.cfg.nextSeasonAt);
      if (a) a.textContent = v; if (b) b.textContent = v;
    }, 1000);
  },
  closeWin() { clearInterval(this._cd); Nav.rewind(); },
  winSummary() {
    const keys = Object.keys(S.q.answers).length;
    const probes = Object.values(S.q.probes).reduce((a, b) => a + b.length, 0);
    const hints = Object.values(S.q.hints).reduce((a, b) => a + b.length, 0);
    const wrong = Object.values(S.q.wrong).reduce((a, b) => a + b, 0);
    return { keys, probes, hints, wrong, ms: Quest.elapsedMs(), score: Quest.score() };
  },
  paintWin() {
    const w = this.winSummary(), f = S.q.final || {};
    $('winBox').innerHTML = `<canvas id="winCanvas"></canvas>
      <div class="win-card">
        <div class="win-glyph">🥚</div>
        <div class="win-t">${esc(f.title || 'L’Œuf d’Or est à vous')}</div>
        <div class="win-s">${esc(S.cfg.seasonTitle)} — arc bouclé</div>
        <p style="color:#CFCFD8;font-size:.9rem;line-height:1.7;margin-top:16px">${f.text || ''}</p>
        <div class="win-stats">
          <div class="stat"><b>${Quest.clock(w.ms)}</b><span>temps</span></div>
          <div class="stat"><b>${w.score.toLocaleString('fr-FR')}</b><span>points</span></div>
          <div class="stat"><b>${w.keys} / ${Quest.total()}</b><span>verrous</span></div>
          <div class="stat"><b>${w.probes}</b><span>sondages</span></div>
          <div class="stat"><b>${w.hints}</b><span>indices</span></div>
          <div class="stat"><b>${w.wrong}</b><span>erreurs</span></div>
        </div>
        ${f.code ? `<div class="win-code">${esc(f.code)}</div>` : ''}
        ${S.cfg.nextSeasonAt ? `<div class="eyebrow">Prochaine chasse dans</div>
          <div class="countdown" id="winCd">${countdownTo(S.cfg.nextSeasonAt)}</div>` : ''}
        <div class="win-actions">
          <button class="btn btn-q" onclick="UI.shareRun()">Copier mon résultat</button>
          <button class="btn btn-s" onclick="UI.closeWin();UI.openDossier()">Voir le dossier</button>
          <button class="btn btn-s" onclick="UI.closeWin()">Retour au catalogue</button>
        </div>
      </div>`;
  },
  shareRun() {
    const w = this.winSummary();
    const grid = Array.from({ length: Quest.total() }, (_, i) => (S.q.wrong[i + 1] || 0) === 0 ? '🟩' : (S.q.wrong[i + 1] < 3 ? '🟨' : '🟥')).join('');
    const txt = `OASIS — ${S.cfg.seasonTitle}\n${grid}  ${Quest.clock(w.ms)} · ${w.score.toLocaleString('fr-FR')} pts\n${w.hints} indice(s) · ${w.probes} sondage(s)\n${S.cfg.shareUrl || location.href}`;
    (navigator.share ? navigator.share({ text: txt }).catch(() => {}) : navigator.clipboard.writeText(txt).then(() => Toast.push('Résultat copié', 'Collez-le où vous voulez.', 'ok')).catch(() => {}));
  },
  celebrate() {
    const c = $('winCanvas'); if (!c || window.matchMedia('(prefers-reduced-motion:reduce)').matches) return;
    const ctx = c.getContext && c.getContext('2d'); if (!ctx) return;
    const box = c.parentElement.getBoundingClientRect();
    c.width = box.width; c.height = box.height;
    const cols = ['#E8B23A', '#C36A2D', '#2FB88A', '#5AC8FA', '#FFFFFF'];
    const P = Array.from({ length: 130 }, () => ({
      x: c.width / 2 + (Math.random() - .5) * 120, y: c.height / 2,
      vx: (Math.random() - .5) * 11, vy: -Math.random() * 13 - 3,
      r: 2 + Math.random() * 4, c: cols[Math.random() * cols.length | 0], a: 1, rot: Math.random() * 6
    }));
    let n = 0;
    (function loop() {
      ctx.clearRect(0, 0, c.width, c.height);
      P.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .32; p.vx *= .995; p.a -= .0075; p.rot += .12;
        if (p.a <= 0) return;
        ctx.save(); ctx.globalAlpha = Math.max(0, p.a); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.c; ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); ctx.restore(); });
      if (++n < 190) requestAnimationFrame(loop); else ctx.clearRect(0, 0, c.width, c.height);
    })();
  }
});

/* ─── Démarrage ─────────────────────────────────────────────────── */
const FALLBACK_KEY = '12ec990be5e1a68af09d09c8ca76fa57';
const BOOT_LINES = [
  'liaison catalogue TMDB…',
  'indexation des genres et des plateformes…',
  'vérification de la chaîne scellée…',
  'accès invité accordé.'
];
async function boot() {
  const log = $('bootLog'), bar = $('bootBar');
  let i = 0;
  const step = () => { if (i < BOOT_LINES.length) { log.innerHTML += (i ? '<br>' : '') + '› ' + BOOT_LINES[i]; bar.style.width = ((i + 1) / BOOT_LINES.length * 100) + '%'; i++; } };
  const iv = setInterval(step, 260); step();

  if (!window.QUEST_CONFIG) {
    log.innerHTML = '› <span style="color:#E1122B">quest-config.js introuvable.</span><br>› le catalogue reste ouvert, la chasse est désactivée.';
    S.cfg = { seasonId: 'none', seasonTitle: 'Aucune saison chargée', tmdbKey: FALLBACK_KEY,
      lang: 'fr-FR', region: 'FR', idSalt: 'x', stageCount: 0, scoring: {}, stageMeta: [] };
    $('footStatus').textContent = 'quest-config.js absent — catalogue seul';
    $('hud').style.display = 'none';
  } else {
    S.cfg = window.QUEST_CONFIG;
    S.cfg.tmdbKey = S.cfg.tmdbKey || FALLBACK_KEY;
    S.cfg.stageCount = S.cfg.stageCount || 4;
    $('footStatus').textContent = `saison ${S.cfg.seasonId} · schéma ${S.cfg.schema} · ${S.cfg.chain?.length || 0} maillon(s) scellé(s)`;
    Quest.init();
  }
  await TMDB.genres();
  try {
    if (await Daily.load()) {
      const tab = $('tabs').querySelector('[data-view="daily"]');
      if (tab && !Daily.run.done) tab.classList.add('todo');
    } else $('tabs').querySelector('[data-view="daily"]')?.remove();
  } catch (e) { console.warn('quotidien indisponible', e); $('tabs').querySelector('[data-view="daily"]')?.remove(); }
  buildPills();
  await App.loadNextRow(); await App.loadNextRow();
  Nav.replace();
  clearInterval(iv); bar.style.width = '100%';
  setTimeout(() => { $('boot').classList.add('gone'); setTimeout(() => $('boot').remove(), 600); }, 500);
  if (location.hash === '#daily' && Daily.ready()) App.setView('daily'); else App.loadNextRow();
}

function buildPills() {
  const host = $('pills'); host.innerHTML = '';
  const all = el('button', 'pill', 'Tout le catalogue'); all.setAttribute('aria-pressed', 'true');
  all.onclick = () => { [...host.children].forEach(p => p.setAttribute('aria-pressed', 'false')); all.setAttribute('aria-pressed', 'true'); App.setView('home'); };
  host.appendChild(all);
  const names = {};
  Object.entries(S.genres.movie).forEach(([id, n]) => names[n] = { movie: id });
  Object.entries(S.genres.tv).forEach(([id, n]) => { names[n] = { ...(names[n] || {}), tv: id }; });
  Object.entries(names).slice(0, 22).forEach(([name, ids]) => {
    const p = el('button', 'pill', name); p.setAttribute('aria-pressed', 'false');
    p.onclick = async () => {
      [...host.children].forEach(x => x.setAttribute('aria-pressed', 'false')); p.setAttribute('aria-pressed', 'true');
      S.mode = 'genre'; $('hero').style.display = 'none';
      const rows = $('rows'); rows.innerHTML = ''; rows.appendChild(skeletonRow());
      const jobs = [];
      if (ids.movie) jobs.push(TMDB.list('discover/movie', { with_genres: ids.movie, sort_by: 'popularity.desc', 'vote_count.gte': 80 }).then(r => ['Films · ' + name, r.map(x => toItem(x, 'movie'))]));
      if (ids.movie) jobs.push(TMDB.list('discover/movie', { with_genres: ids.movie, sort_by: 'vote_average.desc', 'vote_count.gte': 600 }).then(r => ['Les mieux notés · ' + name, r.map(x => toItem(x, 'movie'))]));
      if (ids.tv) jobs.push(TMDB.list('discover/tv', { with_genres: ids.tv, sort_by: 'popularity.desc', 'vote_count.gte': 40 }).then(r => ['Séries · ' + name, r.map(x => toItem(x, 'tv'))]));
      const res = await Promise.all(jobs); rows.innerHTML = '';
      res.forEach(([t, items]) => mountRail(rows, t, 'genre', items.filter(x => x.poster)));
    };
    host.appendChild(p);
  });
}

/* ─── Événements ────────────────────────────────────────────────── */
window.addEventListener('scroll', () => $('head').classList.toggle('scrolled', window.scrollY > 12), { passive: true });
new IntersectionObserver(e => { if (e[0].isIntersecting && S.ready && S.mode === 'home') App.loadNextRow(); }, { rootMargin: '600px' }).observe($('sentinel'));
$('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { SFX.tap(); App.setView(b.dataset.view); } });
$('drawerTabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { SFX.tap(); UI.openDrawer(b.dataset.t); } });
let sTimer;
$('q').addEventListener('input', e => {
  clearTimeout(sTimer); const v = e.target.value.trim();
  sTimer = setTimeout(() => { if (v.length < 2) { if (S.mode === 'search') App.setView(S.view); } else App.search(v); }, 320);
});
document.querySelectorAll('.sheet').forEach(sh => sh.addEventListener('click', e => {
  if (e.target !== sh) return;
  if (sh.id === 'sheetPlayer') UI.closePlayer(); else Nav.rewind();
}));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if ($('rite').classList.contains('on')) return UI.closeRite();
    if ($('sheetPlayer').classList.contains('open')) return UI.closePlayer();
    if ($('sheetWin').classList.contains('open')) return UI.closeWin();
    if ($('sheetDrawer').classList.contains('open')) return UI.closeDrawer();
    if ($('sheetDetail').classList.contains('open')) return UI.closeDetail();
  }
  if (e.key === '/' && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); }
  if (e.key.toLowerCase() === 'j' && !/input|textarea/i.test(document.activeElement.tagName)) UI.openDossier();
  if (e.key.toLowerCase() === 'a' && !/input|textarea/i.test(document.activeElement.tagName)) UI.openAnalyzer();
  if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'f') {
    e.preventDefault();
    if (![...$('drawerTabs').children].some(b => b.dataset.t === 'forge')) {
      const b = el('button', '', 'Forge'); b.dataset.t = 'forge'; b.setAttribute('role', 'tab'); $('drawerTabs').appendChild(b);
    }
    UI.openDrawer('forge');
  }
});
window.addEventListener('beforeunload', () => Save.now());
document.addEventListener('visibilitychange', () => { if (document.hidden) Save.now(); });
if (location.hash === '#forge') setTimeout(() => document.dispatchEvent(new KeyboardEvent('keydown', { key: 'F', ctrlKey: true, shiftKey: true })), 1200);

boot().then(() => { S.ready = true; }).catch(e => { console.error(e); Toast.push('Démarrage incomplet', 'Le catalogue n’a pas pu se charger entièrement.', 'bad'); S.ready = true; });
</script>
